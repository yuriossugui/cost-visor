version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cost-visor-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - sqlite_data:/var/www/database
      - ./backend/storage:/var/www/storage
      - ./backend/bootstrap/cache:/var/www/bootstrap/cache
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
    ports:
      - "9000:9000"
    networks:
      - cost-visor-network
    healthcheck:
      test: ["CMD", "php", "artisan", "inspire"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cost-visor-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - cost-visor-network
    depends_on:
      - backend

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cost-visor-scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - sqlite_data:/var/www/database
      - ./backend/storage:/var/www/storage
      - ./backend/bootstrap/cache:/var/www/bootstrap/cache
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
    command: php artisan schedule:work
    networks:
      - cost-visor-network
    depends_on:
      - backend

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cost-visor-queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - sqlite_data:/var/www/database
      - ./backend/storage:/var/www/storage
      - ./backend/bootstrap/cache:/var/www/bootstrap/cache
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
    command: php artisan queue:work --tries=3 --timeout=90
    networks:
      - cost-visor-network
    depends_on:
      - backend

networks:
  cost-visor-network:
    driver: bridge

volumes:
  sqlite_data: