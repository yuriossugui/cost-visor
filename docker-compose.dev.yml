services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: cost-visor-backend-dev
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
      - ./backend/bootstrap/cache:/var/www/bootstrap/cache
      - sqlite_data_dev:/var/www/database
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
    ports:
      - "9000:9000"
    networks:
      - cost-visor-network-dev
    command: >
      sh -c "php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=9000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: cost-visor-frontend-dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - cost-visor-network-dev
    environment:
      - VITE_API_URL=http://localhost:9000/api
    command: npm run dev -- --host 0.0.0.0

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: cost-visor-scheduler-dev
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
      - ./backend/bootstrap/cache:/var/www/bootstrap/cache
      - sqlite_data_dev:/var/www/database
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
    command: php artisan schedule:work
    networks:
      - cost-visor-network-dev
    depends_on:
      - backend

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: cost-visor-queue-dev
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
      - ./backend/bootstrap/cache:/var/www/bootstrap/cache
      - sqlite_data_dev:/var/www/database
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
    command: php artisan queue:work --tries=3 --timeout=90
    networks:
      - cost-visor-network-dev
    depends_on:
      - backend

networks:
  cost-visor-network-dev:
    driver: bridge

volumes:
  sqlite_data_dev: